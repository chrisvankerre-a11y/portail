<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<script src="fichiers/admin/access.js"></script>

<body>

<h1>Portail Entreprise</h1>

<div class="grid">
  <!-- Page 1 : visible en public (public perms = ["1"]) -->
  <a href="fichiers/1/cat1.html" class="card">1 - Newsletter</a>

  <!-- Pages 2..8 : masquées en public -->
  <a href="fichiers/2/cat2.html" class="card" data-perm="2">2 - Procédures</a>
  <a href="fichiers/3/cat3.html" class="card" data-perm="3">3 - Dashboard</a>
  <a href="fichiers/4/cat4.html" class="card" data-perm="4">4 - Organigramme</a>
  <a href="fichiers/5/cat5.html" class="card" data-perm="5">5 - Outils IA</a>
  <a href="fichiers/6/cat6.html" class="card" data-perm="6">6 - Prévention (Service)</a>
  <a href="fichiers/7/cat7.html" class="card" data-perm="7">7 - Conseils Prévention</a>
  <a href="fichiers/8/cat8.html" class="card" data-perm="8">8 - Documents</a>
</div>

<p>Les fichiers se trouvent dans <strong>R:\Direction</strong>.</p>

<input type="file" id="f">
<div id="viewer" style="margin-top:20px;"></div>

<script>
  const input = document.getElementById("f");
  const viewer = document.getElementById("viewer");

  input.addEventListener("change", async () => {
    const file = input.files?.[0];
    if (!file) return;

    viewer.innerHTML = ""; // reset

    const type = file.type;

    // IMAGE
    if (type.startsWith("image/")) {
      const img = document.createElement("img");
      img.style.maxWidth = "100%";
      img.src = URL.createObjectURL(file);
      viewer.appendChild(img);
      return;
    }

    // PDF
    if (type === "application/pdf") {
      const iframe = document.createElement("iframe");
      iframe.style.width = "100%";
      iframe.style.height = "600px";
      iframe.src = URL.createObjectURL(file);
      viewer.appendChild(iframe);
      return;
    }

    // TEXTE (txt, csv, json, etc.)
    if (type.startsWith("text/") || !type) {
      const text = await file.text();
      const pre = document.createElement("pre");
      pre.textContent = text;
      viewer.appendChild(pre);
      return;
    }

    // FALLBACK
    viewer.textContent = "Type de fichier non prévisualisable dans le navigateur.";
  });
</script>

</body>
</html>
