<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historique Incendie (FM)</title>
  <style>
    body { font-family: system-ui, Arial; margin: 16px; max-width: 1100px; }
    header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .card { border:1px solid #ddd; border-radius:10px; padding:12px; margin-top:12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    label { display:flex; flex-direction:column; font-size:12px; gap:4px; }
    input, select, textarea, button { font: inherit; padding:8px; }
    textarea { width: 100%; min-height: 140px; }
    table { width:100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border-bottom:1px solid #eee; padding:8px; vertical-align:top; }
    th { text-align:left; background:#fafafa; position:sticky; top:0; }
    .muted { color:#666; font-size:12px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #ddd; font-size:12px; }
    .btnDanger { border:1px solid #f2b; }
    .btnTiny { padding:4px 8px; font-size:12px; }
    code { background:#fafafa; border:1px solid #eee; border-radius:6px; padding:2px 6px; }
  </style>
</head>
<body>

<header>
  <div>
    <h2 style="margin:0">Historique Incendie (FM)</h2>
    <span class="muted">
      Coller un message reçu par mail pour l’intégrer à l’historique.
    </span>
  </div>

  <div style="margin-left:auto">
    <a
      href="./centrale_incendie_reception.html"
      target="_blank"
      style="
        display:inline-block;
        padding:8px 12px;
        border:1px solid #ddd;
        border-radius:8px;
        text-decoration:none;
        font-size:13px;
        background:#fafafa;
      "
    >
      ➕ Déclarer un événement (réception)
    </a>
  </div>
</header>

<div class="card">
  <h3 style="margin-top:0">Ajouter un événement reçu par mail</h3>

  <label style="width:100%">
    Colle ici soit :
    <ul class="muted" style="margin:6px 0 0 18px; padding:0">
      <li>tout le texte du mail,</li>
      <li>ou seulement le bloc entre <code>BEGIN/END</code>,</li>
      <li>ou uniquement la ligne “code” (base64url).</li>
    </ul>
    <textarea id="paste"></textarea>
  </label>

  <div class="row" style="margin-top:8px">
    <button id="btnAdd">Ajouter à l’historique</button>
    <button id="btnClearPaste" class="btnTiny">Vider la zone</button>
    <span id="addStatus" class="muted"></span>
  </div>
</div>

<div class="card">
  <h3 style="margin-top:0">Filtrer / Exporter</h3>
  <div class="row">
    <label>
      Statut
      <select id="fStatus">
        <option value="ALL">Tous</option>
        <option value="OPEN">Ouverts</option>
        <option value="CLOSED">Clôturés</option>
      </select>
    </label>

    <label>
      Type
      <select id="fType">
        <option value="ALL">Tous</option>
        <option value="DEF">Défaut</option>
        <option value="ALARM">Alarme</option>
        <option value="TEST">Test</option>
        <option value="INFO">Info</option>
      </select>
    </label>

    <label style="flex:1; min-width:260px">
      Recherche (zone / détecteur / texte)
      <input id="q" placeholder="ex: B1-02 / RDC / défaut..." />
    </label>

    <button id="btnExportXlsx">Export XLSX</button>
    <button id="btnWipe" class="btnDanger btnTiny">Tout effacer</button>
  </div>

  <div class="muted" id="stats" style="margin-top:8px"></div>
</div>

<div class="card">
  <h3 style="margin-top:0">Historique</h3>
  <div style="max-height: 60vh; overflow:auto;">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Zone</th>
          <th>Détecteur</th>
          <th>Description</th>
          <th>Statut</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- XLSX (export). Si ton IT bloque les CDN, dis-le, je te fais une version sans XLSX (CSV) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
  const els = {
    paste: document.getElementById("paste"),
    btnAdd: document.getElementById("btnAdd"),
    btnClearPaste: document.getElementById("btnClearPaste"),
    addStatus: document.getElementById("addStatus"),

    fStatus: document.getElementById("fStatus"),
    fType: document.getElementById("fType"),
    q: document.getElementById("q"),

    btnExportXlsx: document.getElementById("btnExportXlsx"),
    btnWipe: document.getElementById("btnWipe"),

    tbody: document.getElementById("tbody"),
    stats: document.getElementById("stats"),
  };

  // --- Stockage local (sur TON PC) ---
  const LS_KEY = "incendie_fm_history_v1";

  function loadAll() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }
    catch { return []; }
  }

  function saveAll(items) {
    localStorage.setItem(LS_KEY, JSON.stringify(items));
  }

  // --- base64url decode ---
  function base64UrlToUtf8(b64url) {
    let b64 = b64url.trim().replaceAll("-", "+").replaceAll("_", "/");
    const pad = b64.length % 4;
    if (pad === 2) b64 += "==";
    else if (pad === 3) b64 += "=";
    else if (pad !== 0) throw new Error("Code invalide (taille base64url).");

    const bin = atob(b64);
    const bytes = new Uint8Array([...bin].map(ch => ch.charCodeAt(0)));
    return new TextDecoder().decode(bytes);
  }

  function extractPayload(text) {
    const t = (text || "").trim();
    if (!t) throw new Error("Rien à décoder.");

    // 1) bloc BEGIN/END
    const re = /---BEGIN INCENDIE EVENT \(v1\)---\s*([\s\S]*?)\s*---END INCENDIE EVENT---/m;
    const m = t.match(re);
    if (m && m[1]) return m[1].trim();

    // 2) si l’utilisateur colle juste la ligne code
    // on prend la plus longue "ligne" non vide (souvent le payload)
    const lines = t.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!lines.length) throw new Error("Rien à décoder.");
    lines.sort((a,b)=>b.length-a.length);
    return lines[0];
  }

  function normalizeEvent(ev) {
    // Format attendu venant de la réception
    if (!ev || typeof ev !== "object") throw new Error("JSON invalide.");
    if (ev.v !== 1) throw new Error("Version non supportée.");
    if (typeof ev.ts !== "string") throw new Error("Champ ts manquant.");
    if (typeof ev.type !== "string") throw new Error("Champ type manquant.");

    return {
      v: 1,
      ts: ev.ts,
      type: ev.type,
      zone: (ev.zone || "").toString(),
      device: (ev.device || "").toString(),
      message: (ev.message || "").toString(),
    };
  }

  function makeIdFromPayload(payload) {
    // ID stable : le payload lui-même (ça évite les doublons si recopié 2x)
    // On garde un id court pour l’affichage.
    let h = 0;
    for (let i=0;i<payload.length;i++) h = (h*31 + payload.charCodeAt(i)) >>> 0;
    return "E" + h.toString(16).padStart(8, "0");
  }

  function addEventFromText(pastedText) {
    const payload = extractPayload(pastedText);
    const jsonText = base64UrlToUtf8(payload);
    const ev = normalizeEvent(JSON.parse(jsonText));

    const all = loadAll();
    const id = makeIdFromPayload(payload);

    if (all.some(x => x.id === id)) {
      return { added:false, reason:"Déjà présent (doublon)." };
    }

    all.push({
      id,
      ...ev,
      status: "OPEN",
      closedTs: "",
      closedNote: "",
      addedAt: new Date().toISOString(),
    });

    // tri desc
    all.sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
    saveAll(all);
    return { added:true, id };
  }

  function applyFilters(items) {
    const fs = els.fStatus.value;
    const ft = els.fType.value;
    const q = (els.q.value || "").trim().toLowerCase();

    return items.filter(ev => {
      if (fs !== "ALL" && ev.status !== fs) return false;
      if (ft !== "ALL" && ev.type !== ft) return false;
      if (q) {
        const hay = `${ev.zone} ${ev.device} ${ev.message}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function esc(s) {
    return (s ?? "").toString()
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function render() {
    const all = loadAll();
    const filtered = applyFilters(all);

    els.tbody.innerHTML = "";
    for (const ev of filtered) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(ev.ts)}</td>
        <td><span class="pill">${esc(ev.type)}</span></td>
        <td>${esc(ev.zone)}</td>
        <td>${esc(ev.device)}</td>
        <td>${esc(ev.message)}</td>
        <td>${ev.status === "OPEN" ? `<span class="pill" style="border-color:#f0c">OUVERT</span>` : `<span class="pill">CLOTURÉ</span>`}</td>
        <td>
          ${ev.status === "OPEN"
            ? `<button class="btnTiny" data-close="${esc(ev.id)}">Clôturer</button>`
            : `<button class="btnTiny" data-reopen="${esc(ev.id)}">Ré-ouvrir</button>`
          }
          <button class="btnTiny btnDanger" data-del="${esc(ev.id)}">Suppr.</button>
        </td>
      `;
      els.tbody.appendChild(tr);
    }

    els.stats.textContent = `${filtered.length} affiché(s) / ${all.length} total (stocké localement sur ce PC)`;

    // bind actions
    for (const b of els.tbody.querySelectorAll("button[data-close]")) {
      b.addEventListener("click", () => {
        const id = b.getAttribute("data-close");
        const note = prompt("Note de clôture (optionnel) :") ?? "";
        const all = loadAll();
        const ev = all.find(x => x.id === id);
        if (!ev) return;
        ev.status = "CLOSED";
        ev.closedTs = new Date().toISOString();
        ev.closedNote = note.trim();
        saveAll(all);
        render();
      });
    }

    for (const b of els.tbody.querySelectorAll("button[data-reopen]")) {
      b.addEventListener("click", () => {
        const id = b.getAttribute("data-reopen");
        const all = loadAll();
        const ev = all.find(x => x.id === id);
        if (!ev) return;
        ev.status = "OPEN";
        // on garde closedTs/note comme trace (ou on peut les vider si tu préfères)
        saveAll(all);
        render();
      });
    }

    for (const b of els.tbody.querySelectorAll("button[data-del]")) {
      b.addEventListener("click", () => {
        const id = b.getAttribute("data-del");
        const all = loadAll().filter(x => x.id !== id);
        saveAll(all);
        render();
      });
    }
  }

  function exportXlsx() {
    if (typeof XLSX === "undefined") {
      alert("Export XLSX indisponible (lib XLSX non chargée).");
      return;
    }
    const all = loadAll();
    const filtered = applyFilters(all);

    const rows = filtered.map(ev => ({
      Date: ev.ts,
      Type: ev.type,
      Zone: ev.zone,
      "Détecteur": ev.device,
      Description: ev.message,
      Statut: ev.status === "OPEN" ? "OUVERT" : "CLOTURÉ",
      "Date clôture": ev.closedTs || "",
      "Note clôture": ev.closedNote || "",
      "ID": ev.id,
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Historique");
    XLSX.writeFile(wb, `historique_incendie_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // UI
  els.btnAdd.addEventListener("click", () => {
    try {
      const res = addEventFromText(els.paste.value);
      els.addStatus.textContent = res.added ? `Ajouté (${res.id}).` : res.reason;
      render();
    } catch (e) {
      alert(e?.message || String(e));
    }
  });

  els.btnClearPaste.addEventListener("click", () => {
    els.paste.value = "";
    els.addStatus.textContent = "";
  });

  [els.fStatus, els.fType, els.q].forEach(el => el.addEventListener("input", render));

  els.btnExportXlsx.addEventListener("click", exportXlsx);

  els.btnWipe.addEventListener("click", () => {
    if (!confirm("Tout effacer sur ce PC ?")) return;
    localStorage.removeItem(LS_KEY);
    render();
  });

  render();
</script>

</body>
</html>
