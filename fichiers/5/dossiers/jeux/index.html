<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Espace Jeux</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

h1 {
    margin-top: 60px;
    font-size: 2.5rem;
    letter-spacing: 1px;
}

.subtitle {
    opacity: 0.85;
    margin-bottom: 50px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 30px;
    width: 80%;
    max-width: 900px;
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(6px);
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    text-decoration: none;
    color: white;
    font-size: 1.3rem;
    font-weight: 600;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid rgba(255,255,255,0.2);
}

.card:hover {
    transform: translateY(-8px) scale(1.03);
    background: rgba(255,255,255,0.2);
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}

.footer {
    margin-top: auto;
    padding: 30px;
    opacity: 0.6;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<h1>🎮 Espace Jeux</h1>
<div class="subtitle">Choisissez votre jeu</div>

<div class="grid">
    <a href="jeu1.html" class="card">🕹 Jeu 1</a>
    <a href="jeu2.html" class="card">🎲 Jeu 2</a>
    <a href="jeu3.html" class="card">🏆 Jeu 3</a>
</div>

<div class="footer">
    Sélectionnez un jeu pour commencer.
</div>

</body>
</html>
