<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prizepool Poker — Version Simplifiée v2 (Top fixe)</title>
  <style>
    :root{--bg:#0f172a;--panel:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#22c55e;--accent2:#38bdf8}
    *{box-sizing:border-box}
    body{margin:0;background:#0f172a;color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu}
    .wrap{max-width:980px;margin:28px auto;padding:0 16px}
    h1{font-size:22px;margin:0 0 16px}
    .card{background:#111827;border:1px solid rgba(148,163,184,.15);border-radius:14px;padding:16px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,button{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(148,163,184,.25);background:#0b1221;color:#e5e7eb}
    input:focus{outline:2px solid var(--accent2);border-color:transparent}
    .row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
    .btn{cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;background:#0a1120}
    th,td{padding:8px 10px;border-bottom:1px dashed rgba(148,163,184,.25);text-align:right}
    tfoot td{font-weight:700;background:#0a1120}
    .muted{color:#94a3b8}
    #alerts .error{color:#fecaca}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Répartition du prizepool — simplifiée v2 (top et bas fixables)</h1>
  <section class="card">
    <div class="row">
      <div>
        <label>Joueurs</label>
        <input id="players" type="number" min="1" max="4100" step="1" value="120" />
      </div>
      <div>
        <label>Prizepool (€)</label>
        <input id="prize" type="number" min="0" step="1" value="10000" />
      </div>
      <div>
        <label>Premier prix (€) (optionnel)</label>
        <input id="firstTop" type="number" min="0" step="1" placeholder="ex. 25000" />
      </div>
      <div>
        <label>Minimum dernière place (€) (optionnel)</label>
        <input id="minLast" type="number" min="0" step="1" placeholder="ex. 200" />
      </div>
    </div>

    <div style="margin-top:8px">
      <label>Écart minimal entre paliers</label>
      <select id="gapSel" style="max-width:220px">
        <option value="2" selected>2%</option>
        <option value="4">4%</option>
        <option value="6">6%</option>
        <option value="8">8%</option>
        <option value="10">10%</option>
      </select>
      <div class="muted" style="font-size:12px;margin-top:4px">Le palier suivant ≥ palier précédent × (1 + écart).</div>
    </div>

    <div style="display:flex;gap:10px;align-items:center;margin-top:12px">
      <button class="btn" id="compute">Calculer</button>
      <button class="btn" id="exportCsv">Exporter Excel (CSV)</button>
      <button class="btn" id="copyTsv">Copier (TSV)</button>
      <span id="alerts" class="muted"></span>
    </div>

    <table id="table" style="margin-top:12px">
      <thead>
        <tr>
          <th class="right">Place</th>
          <th class="right">% réf.</th>
          <th class="right">% réalisé</th>
          <th class="right">Montant (€)</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td id="totalPctRef">100.000 %</td>
          <td id="totalPctReal">100.000 %</td>
          <td id="totalAmt">0 €</td>
        </tr>
      </tfoot>
    </table>
    <div class="muted" id="summary" style="margin-top:6px;font-size:12px"></div>
  </section>
</div>

    var tds = trs[i].children;

    var amtTxt   = (tds[3] && tds[3].textContent) || "";
    var cleaned  = amtTxt.replace(new RegExp('[^0-9-]','g'), "");
    rows.push([placeTxt, cleaned]);
  }
  return rows;
}

function exportCsv(){
  var alertsEl  = document.getElementById('alerts');
  var playersEl = document.getElementById('players');
  var prizeEl   = document.getElementById('prize');
  var data = collectRows();
  if (!data.length){
    alertsEl.innerHTML = "<span class=\"error\">Rien à exporter. Lance d'abord un calcul.</span>";
    return;
  }
  var header = ["Place","Montant"];
  var lines = [];
  lines.push("sep=;"); // aide Excel FR
  lines.push(header.join(";"));
  for (var i=0; i<data.length; i++){ lines.push(data[i].join(";")); }
  var csv = lines.join("\r\n");

  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var players = Number(playersEl.value||0), prize = Number(prizeEl.value||0);
  var gapPct = Math.round(((typeof GAP_RATIO!=='undefined'?GAP_RATIO:1.02)-1)*100);
  var fname = "repartition_"+players+"p_"+prize+"eur_gap"+gapPct+".csv";
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = fname; a.click(); URL.revokeObjectURL(url);
}

function copyTsv(){
  var alertsEl  = document.getElementById('alerts');
  var data = collectRows();
  if (!data.length){
    alertsEl.innerHTML = "<span class=\"error\">Rien à copier. Lance d'abord un calcul.</span>";
    return;
  }
  var header = ["Place","Montant"];
  var tsvLines = [header.join("	")];
  for (var i=0; i<data.length; i++){ tsvLines.push(data[i].join("	")); }
  var tsv = tsvLines.join("\n");

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(tsv)
      .then(function(){ alertsEl.textContent = "Données copiées (TSV)."; })
      .catch(function(){ alertsEl.innerHTML = "<span class=\"error\">Impossible de copier (droits navigateur).</span>"; });
  } else {
    var ta = document.createElement("textarea"); ta.value = tsv; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); alertsEl.textContent = "Données copiées (TSV)."; }
    catch(e){ alertsEl.innerHTML = "<span class=\"error\">Impossible de copier.</span>"; }
    document.body.removeChild(ta);
  }
}


  function compute(){
    // utilitaires d'export sur la base du tableau actuellement affiché
    function collectRows(){
      var rows = [];
      var trs = tableBody.querySelectorAll('tr');
      for (var i=0;i<trs.length;i++){
        var tds = trs[i].children;
        // tds: [Place, %ref, %real, Montant]
        var placeTxt = (tds[0] && tds[0].textContent) || '';
        var amtTxt   = (tds[3] && tds[3].textContent) || '';
        // "1 234 €" -> "1234"
        var amtNum = amtTxt.replace(/[^0-9-]/g,'');
        rows.push([placeTxt, amtNum]);
      }
      return rows;
    }

    window.exportCsv = function(){
      var data = collectRows();
      if (!data.length){
        alertsEl.innerHTML = "<span class=\"error\">Rien à exporter. Lance d'abord un calcul.</span>";
        return;
      }
      var header = ['Place','Montant'];
      var csvLines = ['sep=;', header.join(';')];
      for (var i=0;i<data.length;i++){ csvLines.push(data[i].join(';')); }
      var csv = "\uFEFF" + csvLines.join("\r\n"); // BOM UTF-8 + CRLF
      var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      var players = Number(playersEl.value||0), prize = Number(prizeEl.value||0);
      var gapPct = Math.round((GAP_RATIO-1)*100);
      var fname = 'repartition_'+players+'p_'+prize+'eur_gap'+gapPct+'.csv';
      var url = URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=fname; a.click();
      URL.revokeObjectURL(url);
    };

    window.copyTsv = function(){
      var data = collectRows();
      if (!data.length){
        alertsEl.innerHTML = "<span class=\"error\">Rien à copier. Lance d'abord un calcul.</span>";
        return;
      }
      var header = ['Place','Montant'];
      var tsvLines = [header.join('\t')];
      for (var i=0;i<data.length;i++){ tsvLines.push(data[i].join('\t')); }
      var tsv = tsvLines.join("\n");
      navigator.clipboard.writeText(tsv)
        .then(function(){ alertsEl.textContent = 'Données copiées (TSV).'; })
        .catch(function(){ alertsEl.innerHTML = "<span class=\"error\">Impossible de copier (droits navigateur).</span>"; });
    };

    // Lire l'écart voulu et l'appliquer globalement (UNE seule fois)
    var gapPct = Number(gapSelEl && gapSelEl.value ? gapSelEl.value : 2);
    GAP_RATIO = 1 + (gapPct/100);

    alertsEl.textContent='';
    var players = Math.max(1, Math.min(4100, Math.floor(Number(playersEl.value)||0)));
    var prize   = Math.max(0, Math.floor(Number(prizeEl.value)||0));
    var n       = (function(){ for(var i=0;i<payoutMap.length;i++){ var r=payoutMap[i]; if(players>=r.min && players<=r.max) return r.places; } return Math.max(1, Math.ceil(players*0.15)); })();
    var firstTop = firstTopEl.value ? Math.max(0, Math.floor(Number(firstTopEl.value)||0)) : null;
    var minLast  = minLastEl.value  ? Math.max(0, Math.floor(Number(minLastEl.value)||0))  : null;

    if(minLast!=null && n*minLast > prize){
      var maxFeasible = Math.floor(prize/n);
      alertsEl.innerHTML = '<span class="error">Minimum '+fmtEUR(minLast)+' trop élevé pour '+n+' places et '+fmtEUR(prize)+'. ≤ '+fmtEUR(maxFeasible)+' recommandé.</span>';
      return;
    }
    if(firstTop!=null && firstTop>prize){
      alertsEl.innerHTML = '<span class="error">Premier prix '+fmtEUR(firstTop)+' dépasse le prizepool.</span>';
      return;
    }

    var pcts = playersToPercents(n);
    if(!pcts || pcts.length!==n){
      alertsEl.innerHTML='<span class="error">Répartition de référence introuvable pour '+n+' places.</span>';
      return;
    }

    var base   = integerizeFromPercents(pcts, prize);
    var tiered = buildTiers(base);
    var groups = detectGroups(tiered);

    var G=groups.length, g0=[], sizes=[];
    for(var g=0; g<G; g++){ g0.push(tiered[groups[g][0]]); sizes.push(groups[g][1]-groups[g][0]+1); }

    // Faisabilité conjointe si top & last imposés
    if(firstTop!=null && minLast!=null){
      var minFromTop = minLastReachableFromTop(firstTop, G, GAP_RATIO);
      var minTopNeed = minTopRequiredFromLast(minLast, G, GAP_RATIO);
      if(minLast > minFromTop){
        alertsEl.innerHTML = '<span class="error">Premier prix '+fmtEUR(firstTop)+' trop bas pour garantir '+fmtEUR(minLast)+' en dernière place avec écart ≥ '+gapPct+'%.</span>';
        return;
      }
      if(firstTop < minTopNeed){
        alertsEl.innerHTML = '<span class="error">Dernière place '+fmtEUR(minLast)+' trop élevée pour un premier prix de '+fmtEUR(firstTop)+' avec écart ≥ '+gapPct+'%.</span>';
        return;
      }
    }

    var gv = applyFirstAndLastConstraints(g0, groups, minLast, firstTop);
    gv = adjustToTotalByGroups(gv, groups, sizes, prize, minLast, firstTop);
    gv = fineTuneWithSingletons(gv, groups, sizes, prize, minLast, firstTop);

    // 2e passe si besoin
    var totalAfter = gv.reduce(function(s,x,i){ return s + x * sizes[i]; }, 0);
    if (totalAfter !== prize) {
      gv = adjustToTotalByGroups(gv, groups, sizes, prize, minLast, firstTop);
      gv = fineTuneWithSingletons(gv, groups, sizes, prize, minLast, firstTop);
      totalAfter = gv.reduce(function(s,x,i){ return s + x * sizes[i]; }, 0);
      if (totalAfter !== prize) {
        alertsEl.innerHTML = '<span class="error">Écart '+gapPct+'% trop contraignant — impossible d\'atteindre exactement le prizepool avec ces paramètres. Réduis l\'écart ou ajuste le 1er prix / le minimum.</span>';
        return;
      }
    }

    var out=[]; for(var gi=0; gi<G; gi++){ var a=groups[gi][0], b=groups[gi][1], val=gv[gi]; for(var k=a;k<=b;k++) out[k]=val; }

    var pctRef  = pcts.slice();
    var pctReal = out.map(function(v){ return prize>0 ? (v/prize*100) : 0; });
    var sumOut  = sum(out);

    tableBody.innerHTML='';
    for(var r=0;r<n;r++){
      var place = (r===0)?'1ère':(r+1)+'e';
      var tr=document.createElement('tr');
      tr.innerHTML = '<td>'+place+'</td>'+
                     '<td>'+fmtPct(pctRef[r])+'</td>'+
                     '<td>'+fmtPct(pctReal[r])+'</td>'+
                     '<td>'+fmtEUR(out[r])+'</td>';
      tableBody.appendChild(tr);
    }
    totalAmtEl.textContent     = fmtEUR(sumOut);
    totalPctRefEl.textContent  = fmtPct(sum(pctRef));
    totalPctRealEl.textContent = fmtPct(sum(pctReal));
    summaryEl.textContent = 'Joueurs: '+players+' · Places payées: '+n+(firstTop!=null?(' · 1er prix='+fmtEUR(firstTop)):'')+(minLast!=null?(' · Dernier min='+fmtEUR(minLast)):'')+' · Paliers: '+G+' · Écart palier ≥ '+gapPct+'%';
  }

  // Listeners
  document.getElementById('compute').addEventListener('click', function(){ try{ compute(); }catch(e){ alertsEl.textContent=e.message; } });
  document.getElementById('exportCsv').addEventListener('click', function(){ try{ exportCsv(); }catch(e){ alertsEl.textContent=e.message; } });
  document.getElementById('copyTsv').addEventListener('click', function(){ try{ copyTsv(); }catch(e){ alertsEl.textContent=e.message; } });

  // Premier calcul au chargement
  try{ compute(); }catch(e){ alertsEl.textContent=e.message; }

})(); // fin IIFE
</script>

<script>
(function () {
  const STORAGE_KEY = "myapp5_license_valid_until";
  const PRODUCT_ID = "MY-APP5-001";
  const WARNING_DAYS = 21; // 3 semaines

  // >>> POUR LES TESTS, tu peux TEMPORAIREMENT remplacer cette ligne :
  const now = new Date();
  // Par exemple :
  // const now = new Date("2025-12-15T12:00:00"); // pour simuler un warning
  // const now = new Date("2026-01-05T12:00:00"); // pour simuler une licence expirée

  const currentYear = now.getFullYear();

  function getLicenseYear() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        // Première utilisation : on considère une licence courante
        return currentYear;
      }
      const y = parseInt(raw, 10);
      if (isNaN(y) || y < currentYear - 10 || y > currentYear + 50) {
        // Valeur incohérente -> on repart sur l'année courante
        return currentYear;
      }
      return y;
    } catch (e) {
      // Si localStorage HS, on considère juste l'année courante
      return currentYear;
    }
  }

  // Formule du code de renouvellement (toi seul la connais en pratique)
  function expectedCode(year) {
    const base = year * 7919 + 137 + 5;
    return ("LIC-" + base.toString(16).toUpperCase());
  }

  function saveLicenseYear(y) {
    try {
      localStorage.setItem(STORAGE_KEY, String(y));
    } catch (e) {
      // ignore
    }
  }

  function daysBetween(d1, d2) {
    const MS = 24 * 60 * 60 * 1000;
    return Math.ceil((d2.getTime() - d1.getTime()) / MS);
  }

  function createOverlay(options) {
    const {
      mode,              // "warning" ou "block"
      productId,
      now,
      licenseYear,
      expiryDate,
      onRenewSuccess,
    } = options;

    const daysLeft = daysBetween(now, expiryDate);

    const overlay = document.createElement("div");
    overlay.style.position = "fixed";
    overlay.style.inset = "0";
    overlay.style.background = "rgba(0,0,0,0.75)";
    overlay.style.display = "flex";
    overlay.style.alignItems = "center";
    overlay.style.justifyContent = "center";
    overlay.style.zIndex = "999999";

    const box = document.createElement("div");
    box.style.background = "#111";
    box.style.color = "#eee";
    box.style.padding = "24px";
    box.style.borderRadius = "8px";
    box.style.minWidth = "320px";
    box.style.maxWidth = "480px";
    box.style.fontFamily = "system-ui, -apple-system, BlinkMacSystemFont, sans-serif";
    box.style.boxShadow = "0 8px 24px rgba(0,0,0,0.5)";
    box.style.textAlign = "left";

    const title = document.createElement("h2");
    title.style.marginTop = "0";
    title.style.marginBottom = "8px";
    title.style.fontSize = "18px";

    const product = document.createElement("div");
    product.textContent = "Produit : " + productId + "  •  Licence " + licenseYear;
    product.style.fontSize = "12px";
    product.style.opacity = "0.8";
    product.style.marginBottom = "12px";

    const msg = document.createElement("div");
    msg.style.fontSize = "13px";
    msg.style.marginBottom = "12px";

    const info = document.createElement("div");
    info.style.fontSize = "12px";
    info.style.opacity = "0.9";
    info.style.marginBottom = "16px";

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Code de renouvellement";
    input.style.width = "100%";
    input.style.boxSizing = "border-box";
    input.style.padding = "6px 8px";
    input.style.marginBottom = "8px";
    input.style.borderRadius = "4px";
    input.style.border = "1px solid #555";
    input.style.background = "#222";
    input.style.color = "#eee";

    const error = document.createElement("div");
    error.style.color = "#ff6b6b";
    error.style.fontSize = "12px";
    error.style.minHeight = "16px";
    error.style.marginBottom = "8px";

    const buttonsRow = document.createElement("div");
    buttonsRow.style.display = "flex";
    buttonsRow.style.gap = "8px";
    buttonsRow.style.marginTop = "8px";

    const btnValidate = document.createElement("button");
    btnValidate.textContent = "Valider le code";
    btnValidate.style.padding = "6px 12px";
    btnValidate.style.borderRadius = "4px";
    btnValidate.style.border = "none";
    btnValidate.style.cursor = "pointer";
    btnValidate.style.background = "#2f86ff";
    btnValidate.style.color = "#fff";
    btnValidate.style.fontSize = "13px";

    let btnContinue = null;
    if (mode === "warning") {
      btnContinue = document.createElement("button");
      btnContinue.textContent = "Continuer sans renouveler";
      btnContinue.style.padding = "6px 12px";
      btnContinue.style.borderRadius = "4px";
      btnContinue.style.border = "none";
      btnContinue.style.cursor = "pointer";
      btnContinue.style.background = "#444";
      btnContinue.style.color = "#eee";
      btnContinue.style.fontSize = "13px";

      btnContinue.addEventListener("click", function () {
        document.body.removeChild(overlay);
      });
    }

    btnValidate.addEventListener("click", function () {
      const value = (input.value || "").trim().toUpperCase();
      const nextYear = licenseYear + 1; // chaque code prolonge d'un an
      const expected = expectedCode(nextYear);
      if (value === expected) {
        saveLicenseYear(nextYear);
        document.body.removeChild(overlay);
        if (typeof onRenewSuccess === "function") onRenewSuccess(nextYear);
      } else {
        error.textContent = "Code invalide (ERR-403-LIC).";
      }
    });

    if (mode === "warning") {
      title.textContent = "Avertissement de licence";
      msg.textContent = "Votre licence va expirer prochainement.";
      info.textContent = "La licence actuelle expire dans " + daysLeft +
        " jour" + (daysLeft > 1 ? "s" : "") +
        ". Demandez le code d’activation pour prolonger l’utilisation.";
    } else {
      title.textContent = "Licence expirée";
      msg.textContent = "La licence locale est arrivée à expiration.";
      info.textContent = "Un code de renouvellement est requis pour continuer à utiliser ce programme.";
    }

    buttonsRow.appendChild(btnValidate);
    if (btnContinue) {
      buttonsRow.appendChild(btnContinue);
    }

    box.appendChild(title);
    box.appendChild(product);
    box.appendChild(msg);
    box.appendChild(info);
    box.appendChild(input);
    box.appendChild(error);
    box.appendChild(buttonsRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  function checkLicense() {
    const licenseYear = getLicenseYear();
    const expiryDate = new Date(licenseYear, 11, 31, 23, 59, 59); // 31/12 licenceYear
    const warningStart = new Date(expiryDate.getTime() - WARNING_DAYS * 24 * 60 * 60 * 1000);

    if (now > expiryDate) {
      // Licence expirée -> blocage dur
      createOverlay({
        mode: "block",
        productId: PRODUCT_ID,
        now,
        licenseYear,
        expiryDate,
        onRenewSuccess: function () {
          // rien de spécial à faire après, la page est déjà chargée
        }
      });
      return;
    }

    if (now >= warningStart) {
      // Fenêtre de warning -> message à chaque ouverture tant qu'il n'a pas renouvelé
      createOverlay({
        mode: "warning",
        productId: PRODUCT_ID,
        now,
        licenseYear,
        expiryDate,
        onRenewSuccess: function () {
          // après renouvellement, plus de warning (licenceYear+1, warning l'année suivante)
        }
      });
    }
    // Si on est avant warningStart : rien, fonctionnement normal
  }

  window.addEventListener("load", checkLicense);
})();
</script>
