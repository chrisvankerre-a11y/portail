<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Outil Feedback</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: linear-gradient(135deg, #4b79a1, #283e51);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

h1 {
    margin-top: 60px;
    font-size: 2.3rem;
}

.subtitle {
    opacity: 0.85;
    margin-bottom: 40px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    width: 85%;
    max-width: 1000px;
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    padding: 35px 20px;
    text-align: center;
    text-decoration: none;
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid rgba(255,255,255,0.2);
}

.card:hover {
    transform: translateY(-6px) scale(1.02);
    background: rgba(255,255,255,0.2);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

.footer {
    margin-top: auto;
    padding: 30px;
    opacity: 0.6;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<h1>💬 Outil Feedback</h1>
<div class="subtitle">Collecte et gestion des retours</div>

<div class="grid">

    <!-- QR Code -->
    <a href="feedback.png" class="card" target="_blank">
        📱 Afficher le QR Code
    </a>

    <!-- Application Feedback -->
    <a href="https://chrisvankerre-a11y.github.io/feedback-circus-namur/" 
       class="card" target="_blank">
        🌐 Ouvrir l'application Feedback
    </a>

    <!-- Google Sheet -->
    <a href="https://docs.google.com/spreadsheets/d/1Lgbp8Vy7pTwUXtnYqZ6DqLsgywfVSe03rrCDvAQMF1Y/edit?gid=0#gid=0" 
       class="card" target="_blank">
        📊 Consulter les réponses (Google Sheet)
    </a>

    <!-- Mode d'emploi -->
    <a href="feedback.pdf" class="card" target="_blank">
        📄 Mode d'emploi
    </a>

</div>

<div class="footer">
    Sélectionnez une action.
</div>

</body>
</html>
